name: Calculate card-name statistics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Calculate statistics
        run: python uncube_calculator.py
